name: Anatomy123 current-main native integration proof
'on':
  workflow_dispatch: {}
  push:
    branches:
    - proof/anatomy123-native-20261021
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source:
        - main
        - candidate
    steps:
    - uses: actions/checkout@v7
      with:
        repository: wheresryan22/anatomy
        ref: 1482e8469b0a9e0d8cc18ea2740a01423d29ae80
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Bind exact base and apply only source patch
      run: "set -euo pipefail\n[ \"$(git rev-parse HEAD)\" = \"1482e8469b0a9e0d8cc18ea2740a01423d29ae80\" ]\nmkdir -p \"$RUNNER_TEMP/proof\"\nprintf '%s\\n' \"${ImageOS:-unknown}\" \"${ImageVersion:-unknown}\" > \"$RUNNER_TEMP/proof/runner-image.txt\"\nif [ \"${{ matrix.source }}\" = candidate ]; then\n  printf '%s' '' | base64 --decode | gzip --decompress > /tmp/source.patch\n  echo 'b2b9ebd029ec12d67cdd0109e05f12bd371c1adcf84feed2d7e52e997614c937  /tmp/source.patch' | shasum -a 256 -c -\n  git apply --index /tmp/source.patch\nfi\nnode --version > \"$RUNNER_TEMP/proof/node-version.txt\"\n"
    - name: Dial indicator
      run: 'node examples/dial-indicator/build.mjs

        node examples/dial-indicator/build.mjs --light

        '
    - name: Desk computer
      run: 'node examples/desk-computer/build.mjs

        node examples/desk-computer/build.mjs --light

        '
    - name: Arcade cabinet
      run: 'node examples/arcade-cabinet/build.mjs

        node examples/arcade-cabinet/build.mjs --light

        '
    - name: Ripple tank
      run: 'node examples/ripple-tank/build.mjs

        node examples/ripple-tank/build.mjs --light

        '
    - name: Turning dial
      run: 'node examples/turning-dial/build.mjs

        node examples/turning-dial/build.mjs --light

        node examples/turning-dial/build.mjs --light --verify

        node examples/turning-dial/stress.mjs --light

        '
    - name: Raptor engine
      run: 'node examples/raptor-engine/build.mjs

        node examples/raptor-engine/build.mjs --light

        '
    - name: Push button
      run: 'node examples/push-button/build.mjs

        node examples/push-button/build.mjs --light

        '
    - name: Match every regenerated page and source to qualified candidate tree
      run: "set -euo pipefail\ngit add -u\nexpected='89299cdfce386a71723a7e57bb9fe219875582fc'\nif [ \"${{ matrix.source }}\" = candidate ]; then expected='b59cfacec9b8cd6dd038783167556c5fc651b559'; fi\n[ \"$(git write-tree)\" = \"$expected\" ]\nprintf '%s\\n' \"$expected\" > \"$RUNNER_TEMP/proof/source-tree.txt\"\nif [ \"${{ matrix.source }}\" = candidate ]; then\n  proof_commit=$(printf '%s\\n' 'Private exact-tree native qualification' | git -c user.name='Proof Runner' -c user.email='proof@example.invalid' commit-tree \"$expected\" -p 1482e8469b0a9e0d8cc18ea2740a01423d29ae80)\n  git update-ref HEAD \"$proof_commit\"\nfi\ngit diff --check\ngit diff --cached --check\ntest -z \"$(git status --porcelain)\"\n"
    - name: Regression tests
      run: 'test_deps="$(mktemp -d)"

        trap ''rm -rf "$test_deps"'' EXIT

        npm install --prefix "$test_deps" --no-audit --no-fund --ignore-scripts react@19.3.0 react-dom@19.3.0 typescript@5.9.3 esbuild@0.28.2

        NODE_PATH="$test_deps/node_modules" node --test scripts/*.test.mjs > "$RUNNER_TEMP/proof/canonical-tests.log" 2>&1

        '
    - name: Capture changed rounded-corner examples at4x in both themes
      if: success() && matrix.source == 'candidate'
      run: "set -euo pipefail\nfor page in arcade-cabinet/arcade-cabinet arcade-cabinet/arcade-cabinet-light desk-computer/desk-computer desk-computer/desk-computer-light; do\n  node scripts/capture.mjs \"examples/$page.html\" --out \"$RUNNER_TEMP/proof/${page##*/}-4x.png\" --scale 4 --reduced > \"$RUNNER_TEMP/proof/${page##*/}-capture.log\" 2>&1\ndone\n"
    - name: Always verify unchanged tracked sources
      if: always()
      run: 'set -euo pipefail

        git diff --exit-code

        git diff --cached --exit-code

        [ "$(git write-tree)" = "$(cat "$RUNNER_TEMP/proof/source-tree.txt")" ]

        printf ''%s\n'' PASS > "$RUNNER_TEMP/proof/post-source-guard.txt"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: anatomy123-${{ matrix.source }}
        path: ${{ runner.temp }}/proof
        if-no-files-found: error
