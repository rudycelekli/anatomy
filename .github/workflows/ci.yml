name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild the examples
    runs-on: macos-latest
    defaults:
      run:
        working-directory: source
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: packet
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: rudycelekli/anatomy
          ref: d0fc75b3c07c44c0f0462b07dfa4cb89eac7010d
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Exact reviewed source guards
        run: |
          test "$(git -C ../packet rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(shasum -a 256 ../packet/proof/full-source-guard.py | cut -d' ' -f1)" = "97ff6136efddd183b3de2dd4a260917c2a88bc27683d70773cedc371260b8e9b"
          python3 ../packet/proof/full-source-guard.py . ../source-before.json

      - name: Regression tests
        run: |
          test_deps="$(mktemp -d)"
          trap 'rm -rf "$test_deps"' EXIT
          npm install --prefix "$test_deps" --no-audit --no-fund --ignore-scripts react@19.3.0 react-dom@19.3.0 typescript@5.9.3 esbuild@0.28.2
          NODE_PATH="$test_deps/node_modules" node --test scripts/*.test.mjs

      - name: Dial indicator
        run: |
          node examples/dial-indicator/build.mjs
          node examples/dial-indicator/build.mjs --light

      - name: Desk computer
        run: |
          node examples/desk-computer/build.mjs
          node examples/desk-computer/build.mjs --light

      - name: Arcade cabinet
        run: |
          node examples/arcade-cabinet/build.mjs
          node examples/arcade-cabinet/build.mjs --light

      - name: Ripple tank
        run: |
          node examples/ripple-tank/build.mjs
          node examples/ripple-tank/build.mjs --light

      - name: Turning dial
        run: |
          node examples/turning-dial/build.mjs
          node examples/turning-dial/build.mjs --light
          node examples/turning-dial/build.mjs --light --verify
          node examples/turning-dial/stress.mjs --light

      - name: Raptor engine
        run: |
          node examples/raptor-engine/build.mjs
          node examples/raptor-engine/build.mjs --light

      - name: Committed pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"


      - name: Final independent source hash guard
        if: always()
        run: python3 ../packet/proof/full-source-guard.py . ../source-after.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reviewed-curve-source-receipts
          path: |
            source-before.json
            source-after.json
